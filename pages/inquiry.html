    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap">

</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

    <div class="nav-logo">

        <a href="../index.html">

            <img src="../images/cosmos-gold.png" alt="COSMOS">

        </a>

    </div>

    <nav>

        <ul>

            <li><a href="../index.html">HOME</a></li>

            <li><a href="about.html">ABOUT</a></li>

            <li><a href="cabinets.html">CABINETS</a></li>

            <li><a href="drawers.html">DRAWERS</a></li>

            <li><a href="projects.html">PROJECTS</a></li>

            <li><a href="inquiry.html" class="active">INQUIRY</a></li>

        </ul>

    </nav>

</header>



<!-- ================= PAGE BANNER ================= -->

<section class="page-banner">

    <div class="banner-overlay"></div>

    <div class="banner-content">

        <h1>Inquiry</h1>

        <p>We'd love to hear from you.</p>

    </div>

</section>



<!-- ================= FORM SECTION ================= -->

<section class="inquiry-section">

    <div class="container">

        <div class="section-title">

            <h5>GET IN TOUCH</h5>

            <h2>How Can We Help You?</h2>

            <p>
                Complete the form below and our team will contact you shortly.
            </p>

        </div>

        <form class="inquiry-form">

            <div class="form-grid">

                <input type="text" placeholder="Full Name*" required>

                <input type="email" placeholder="Email*" required>

                <input type="tel" placeholder="Phone Number*" required>

                <input type="text" placeholder="Company Name">

                <select>

                    <option>Select Showroom</option>

                    <option>Boston</option>
                    <option>Charleston</option>
                    <option>Charlotte</option>
                    <option>Dallas</option>
                    <option>Greensboro</option>
                    <option>Nashville</option>
                    <option>Raleigh</option>
                    <option>Washington DC</option>
                    <option>Atlanta</option>
                    <option>Houston</option>
                    <option>North Bergen</option>
                    <option>Philadelphia</option>
                    <option>Windsor</option>

                </select>

                <input type="text" placeholder="Subject">

            </div>

            <textarea placeholder="Your Message"></textarea>

            <button type="submit">

                SEND INQUIRY

            </button>

        </form>

    </div>

</section>



<script src="../js/inquiry.js"></script>

</body>

</html>
